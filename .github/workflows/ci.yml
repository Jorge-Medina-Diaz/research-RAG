# CI que hace ciertos los badges del README.
#
# Un badge estático que dice «83 passing» y que nadie comprueba es, literalmente,
# «un parámetro que se lee como vivo y no lo está» — la frase que este repo usa
# cuatro veces para criticar a Agno. Un lector externo lo señaló, y tenía razón.
#
# Todo lo de aquí corre SIN NINGUNA CLAVE de API, que es la propiedad que hace
# posible tener CI en un proyecto de este tipo: los embeddings en modo mock son
# deterministas y la señal de nivel 0 no llama a ningún modelo.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ai
          POSTGRES_PASSWORD: ai
          POSTGRES_DB: ai
        ports: ['5533:5432']
        options: >-
          --health-cmd "pg_isready -U ai -d ai"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgresql+psycopg://ai:ai@localhost:5533/ai
      EMBEDDINGS_PROVIDER: mock
      LLM_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - name: instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: entorno
        run: uv sync --extra dev

      - name: lint
        run: uv run ruff check .

      - name: tests
        run: uv run pytest -q

      # Las tres comprobaciones de abajo son las que de verdad justifican tener
      # CI: no comprueban que el código corra, comprueban que las AFIRMACIONES
      # del README sigan siendo ciertas.

      - name: 'el entorno arranca sin ninguna clave'
        run: uv run rag verificar

      # Dos cosas que se parecen y no son la misma, y confundirlas puso este CI
      # en rojo por un estado conocido y documentado:
      #
      #   PUERTA DE PROMOCIÓN — «¿es esto lo bastante bueno para aceptarlo?».
      #     Es `recall >= 0,85`, la decide el arnés, y hoy está ROTA por 0,0167
      #     — menos de lo que mueve una sola probe. Es una decisión de producto.
      #
      #   GUARDIA DE REGRESIÓN — «¿se ha roto la recuperación?». Es lo único que
      #     un CI puede juzgar sin criterio humano, y el umbral tiene que estar
      #     muy por debajo del suelo: un derrumbe, no un roce.
      #
      # La primera versión de este paso ponía la puerta de promoción en el CI, y
      # entonces el badge se ponía rojo por algo que el README ya explica en tres
      # sitios. Un CI rojo por un motivo conocido se ignora a los tres días, y
      # ahí deja de detectar los desconocidos: el detector que siempre dispara,
      # otra vez.
      #
      # (El código de salida también se ignora: `rag eval` devuelve 1 cuando no
      # pasan todas las probes, que es correcto para una puerta e inútil aquí.)
      - name: 'la ingesta y el nivel 0 funcionan de punta a punta'
        run: |
          cp -r artefactos/corpus/2026/*.md artefactos/entrada/
          uv run rag ingerir
          uv run rag eval --json runs/ci.json || true
          uv run python - <<'PY'
          import json, pathlib
          crudo = pathlib.Path("runs/ci.json").read_text(encoding="utf-8")
          # NaN no es JSON válido y rompe a cualquiera que lea el informe.
          assert "NaN" not in crudo, "el informe trae NaN"
          d = json.loads(crudo)
          r = d["resumen"]
          assert d["nivel"] == "0", d["nivel"]
          assert r["total"] >= 20, f"solo {r['total']} probes medibles: el conjunto se encogió"
          assert r["pasan"] > 0, "no pasa ni una: la recuperación está rota"
          # Guardia de regresión, no puerta. Muy por debajo del suelo de 0,85 a
          # propósito: por debajo de 0,60 no hay ajuste que lo explique, hay una
          # avería —un carril caído, un índice sin crear, un embedder cambiado—.
          assert r["recall"] >= 0.60, f"recall {r['recall']:.4f}: derrumbe, no roce"
          print(f"  nivel 0: pasan {r['pasan']}/{r['total']}, recall {r['recall']:.2f}")
          if r["recall"] < 0.85:
              print("  (bajo el suelo de promoción de 0,85 — es un estado conocido,")
              print("   documentado en el README, y no es trabajo del CI juzgarlo)")
          PY

      - name: 'los índices HNSW y GIN existen de verdad'
        run: |
          uv run python - <<'PY'
          from cerebro.almacen import conexion, ESQUEMA
          from cerebro.config import tabla_fragmentos
          with conexion() as con:
              filas = con.execute(
                  "select indexname from pg_indexes where schemaname=%s and tablename=%s",
                  (ESQUEMA, tabla_fragmentos()),
              ).fetchall()
          nombres = {f["indexname"] for f in filas}
          # Agno no los crea: si esto falla, `almacen.crear_indices()` dejó de
          # llamarse y `hnsw_m` volvió a ser una palanca sobre nada.
          assert any(n.endswith("_hnsw") for n in nombres), nombres
          assert any(n.endswith("_gin") for n in nombres), nombres
          print("  hnsw y gin presentes:", sorted(nombres))
          PY

      # «Una palanca por ronda» como código de salida. Que tocar la spec cambie
      # el digest del juez lo fija `tests/test_arnes.py`; aquí se comprueba de
      # punta a punta lo único que el nivel 0 puede comprobar, porque en nivel 0
      # no hay juez y su huella no entra en la identidad.
      # Las palancas se mueven RELATIVO al valor actual, nunca a un número
      # escrito aquí. Estaban escritos —`top_k: int = 20`— y la ronda 1 del
      # bucle dejó `top_k` en 20: el `sed` pasó a no cambiar nada, el diff dijo
      # «misma configuración: esto mide RUIDO» y la comprobación se cayó.
      #
      # Se cayó, que es lo correcto. Pero se cayó por obsolescencia y no por el
      # defecto que vigila, y una prueba que puede quedarse vieja al ritmo al
      # que el bucle mueve palancas es una prueba que va a mentir. Bumpear el
      # valor leído hace que el no-op sea imposible por construcción.
      - name: 'el diff se niega cuando se mueven dos palancas'
        run: |
          uv run rag eval --json runs/ci-base.json || true
          uv run python .github/scripts/mover_palanca.py top_k
          uv run rag eval --diff runs/ci-base.json | tee /tmp/uno.txt || true
          grep -q 'palanca: top_k' /tmp/uno.txt
          uv run python .github/scripts/mover_palanca.py k_rrf
          uv run rag eval --diff runs/ci-base.json | tee /tmp/dos.txt || true
          grep -q 'palancas movidas a la vez' /tmp/dos.txt
          git checkout cerebro/config.py

      - name: 'los diagramas mermaid parsean'
        run: |
          npm install --silent --no-save mermaid@11 jsdom
          node .github/scripts/comprobar-mermaid.mjs .

      - name: 'ningún enlace interno de la documentación está roto'
        run: uv run python .github/scripts/comprobar_enlaces.py
