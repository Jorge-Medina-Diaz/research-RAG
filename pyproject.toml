[project]
name = "research-rag"
version = "0.1.0"
description = "Memoria viva de I+D sobre Agno, con bucle de auto-mejora convergente a spec"
readme = "README.md"
# agno 2.8.6 exige >=3.9. Pedimos 3.12: 3.13 todavía deja fuera alguna rueda
# binaria de las dependencias opcionales (sentence-transformers).
requires-python = ">=3.12"

dependencies = [
  "agno==2.8.6",
  "anthropic>=0.40",
  "openai>=1.60",
  "pgvector>=0.3",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pydantic>=2.9",
]

[project.scripts]
# Sustituye al Makefile: en Windows no hay make. `uv run rag up`.
rag = "tareas:main"

[project.optional-dependencies]
# Palancas que arrastran dependencias pesadas. `make extras`.
# Sin esto, chunking='semantic' y reranker='local' fallan con un mensaje que
# dice exactamente qué instalar, en vez de con un ImportError a pelo.
#
# sentence-transformers está aquí porque `reranker` es una palanca de GRADA 2,
# de las que el bucle mueve sin pedir permiso: conviene tenerla resuelta antes.
extras = [
  "numpy>=1.26",
  "sentence-transformers>=3.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

# Sin esto, uv trata el proyecto como VIRTUAL: instala las dependencias y no
# instala el proyecto, así que `[project.scripts]` no crea nada y `uv run rag`
# falla con «Failed to spawn: rag».
#
# En esta máquina funcionaba igualmente, por estado histórico del `.venv`. En un
# clon limpio no, y el único comando que documenta el README es precisamente
# `uv run rag up`. Lo cazó el CI en su primera ejecución de verdad, que es
# literalmente para lo que se montó.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Disposición plana: no hay `src/`, así que hay que nombrar los paquetes. La
# instalación es EDITABLE (lo que hace `uv sync` con el proyecto raíz), y eso
# importa aquí más de lo normal: el bucle edita `cerebro/config.py` en el árbol
# de trabajo, y una copia en site-packages leería la configuración de ayer.
packages = ["cerebro", "evals", "ingesta", "scripts"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# La suite entera corre sin red y sin claves. Si algún test necesita una clave,
# está mal escrito: la señal de nivel 0 es determinista por diseño.
addopts = "-q"
