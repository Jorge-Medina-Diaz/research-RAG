  # ══════════════════════════════════════════════════════════════════════════
  # P-22 … P-41 · el lote que reequilibra el conjunto.
  #
  # Antes de esto había 21 probes y 11 eran de `fuera_de_alcance`: el 52 %. Un
  # sistema que contestara «No lo tengo en la memoria.» a absolutamente todo
  # sacaba 11/21, y ese es el óptimo degenerado que la categoría existe para
  # impedir — alcanzable desde dentro del propio conjunto.
  #
  # La salida NO fue quitar probes del freno —para eso está el suelo de estrato—
  # sino escribir corpus real que preguntar. Ocho artefactos más, y de ahí estas
  # veinte. El freno queda en 11 de 41, un 27 %.
  # ══════════════════════════════════════════════════════════════════════════

  # ---- single_hop: un artefacto, un dato ----

  - id: P-22
    categoria: single_hop
    clase: dependiente
    consulta: ¿En qué línea de pgvector.py está comentado el predicado @@?
    espera: Responde 1157, citando el teardown de hybrid_search.
