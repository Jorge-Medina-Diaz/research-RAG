# Golden set del cerebro.
#
# Estratificado por las seis categorías de cerebro/spec.md. La estratificación
# no es cosmética: cada categoría falla por un motivo distinto y se arregla con
# una palanca distinta, así que un conjunto que no las cubra todas deja al bucle
# sin señal para diagnosticar.
#
# `fuera_de_alcance` es la categoría que impide que el bucle aprenda a subir la
# nota recuperando cada vez más contexto y respondiendo a todo. Si la quitas, el
# bucle degenera.
#
# SUELO, y es PROPORCIONAL: `max(4, 20 % de las activas)`, en
# `evals/entorno.py:suelo_de_estrato`. Por debajo de eso el arnés se niega a
# correr — no avisa, se niega. Con las 41 de aquí el suelo es 8 y hay 11.
#
# Este comentario decía «por debajo de 12 probes activas», que era el suelo fijo
# de la primera versión y que el propio código descartó después: sobre un
# conjunto de 21 habría sido el 57 % y habría empujado a escribir probes de
# relleno para pasar la puerta. Quedó aquí un mes de más, en el fichero que el
# repo llama denegado a la edición, diciendo un número que ninguna línea de
# código respeta. Lo encontró un lector externo comparando las dos fuentes.
#
# DOS CLASES, y es la diferencia que hace medible un corpus que crece:
#
#   invariante   la conducta se cumple pase lo que pase con el corpus. No caduca.
#   dependiente  necesita artefactos concretos, declarados en `requiere`. Si uno
#                deja de estar vigente, la probe se SUSPENDE, no falla.
#
# Las `fuera_de_alcance` llevan `clave_negativa`: la cadena exacta que debe
# estar AUSENTE del corpus. Tras cada ingesta se busca literalmente —código, no
# juez—; si aparece, la probe caduca ruidosamente y sale del denominador. No
# pasa, no falla, y no se borra.
#
# El bucle PUEDE proponer probes a partir del tráfico real. NO puede escribirlas
# aquí sin tu etiqueta, y NO puede escribir ninguna de `fuera_de_alcance`: esa
# categoría se define por lo que no está, y un corpus no propone su propio
# espacio negativo.

probes:
  # ------------------------------------------------------------- single_hop
  - id: P-01
    categoria: single_hop
    clase: dependiente
    consulta: ¿Qué versión de Agno tengo verificada?
    espera: Responde 2.8.6, citando alguno de los artefactos de teardown.
    reglas: [R1, R3, R4]
    requiere: [2026-08-12-agno-pgvector-indices-decorativos]

  - id: P-02
    categoria: single_hop
    clase: dependiente
    consulta: ¿Qué constante usa RRF por defecto y quién la propuso?
    espera: Responde k=60, Cormack, Clarke y Buettcher, SIGIR 2009.
    reglas: [R1, R3, R4]
    requiere: [2026-08-12-epocas-para-medir-un-corpus-que-crece]

  - id: P-03
    categoria: single_hop
    clase: dependiente
    consulta: ¿Qué método de PgVector crea los índices y quién lo llama?
    espera: Responde optimize(), y que nada en agno lo llama salvo singlestore.py.
    reglas: [R1, R3, R4]
    requiere: [2026-08-12-agno-pgvector-indices-decorativos]

  # -------------------------------------------------------------- multi_hop
  - id: P-04
    categoria: multi_hop
    clase: dependiente
    consulta: >-
      Si el fingerprint de Agno no incluye el corpus, ¿qué mecanismo usé para
      que una medición siga siendo comparable cuando añado artefactos?
    espera: >-
      Cruza los dos artefactos: el fingerprint es ciego al corpus, y la respuesta
      son las épocas — filtrar al medir y no al servir. Cita los dos.
    reglas: [R1, R3, R5]
    requiere:
      - 2026-08-12-agno-env-fingerprint-ciego-al-corpus
      - 2026-08-12-epocas-para-medir-un-corpus-que-crece

  - id: P-05
    categoria: multi_hop
    clase: dependiente
    consulta: >-
      ¿Qué tienen en común el fallo de los índices de PgVector y el del
      fingerprint de environments?
    espera: >-
      Los dos son parámetros o detectores que se leen como vivos y no lo están,
      sin lanzar ningún error. Cita los dos artefactos.
    reglas: [R1, R3, R5]
    requiere:
      - 2026-08-12-agno-pgvector-indices-decorativos
      - 2026-08-12-agno-env-fingerprint-ciego-al-corpus

  # ------------------------------------------------------------ aggregation
  - id: P-06
    categoria: aggregation
    clase: dependiente
    consulta: ¿Qué defectos he encontrado en Agno 2.8.6?
    espera: >-
      Enumera al menos: índices no creados, GIN con el idioma sin comillas, @@
      comentado en hybrid_search, y el fingerprint ciego al corpus.
    reglas: [R1, R3]
    requiere:
      - 2026-08-12-agno-pgvector-indices-decorativos
      - 2026-08-12-agno-env-fingerprint-ciego-al-corpus

  # ---------------------------------------------------------- lexical_exact
  - id: P-07
    categoria: lexical_exact
    clase: dependiente
    consulta: ¿ef_search o ef_construction? ¿Cuál de los dos configuré a 200?
    espera: >-
      Responde ef_construction = 200. Distingue los dos símbolos sin
      confundirlos.
    reglas: [R1, R3, R4]
    requiere: [2026-08-12-agno-pgvector-indices-decorativos]

  - id: P-08
    categoria: lexical_exact
    clase: dependiente
    consulta: ¿En qué línea exacta está el predicado comentado de hybrid_search?
    espera: Responde pgvector.py:1157.
    reglas: [R1, R3, R4]
    requiere: [2026-08-12-agno-pgvector-indices-decorativos]

  - id: P-09
    categoria: lexical_exact
    clase: invariante
    consulta: ¿Qué versión es envfp2 y a qué se refiere?
    espera: >-
      Si está en el corpus, responde que es la versión del payload del
      env_fingerprint. Si no, se abstiene con la frase exacta.
    reglas: [R1, R3, R4]

  # ----------------------------------------------------------------temporal
  - id: P-10
    categoria: temporal
    clase: invariante
    consulta: >-
      ¿Sigue siendo cierto lo que dice el artefacto más antiguo sobre el
      troceado?
    espera: >-
      Si algún artefacto declara superar a otro, da el vigente y nombra el que
      lo superó. Si no hay superación en el corpus, lo dice sin inventarla.
    reglas: [R1, R3, R6]

  # ------------------------------------------------------- fuera_de_alcance
  # El freno. Cada una lleva la cadena que debe estar AUSENTE del corpus.
  - id: P-11
    categoria: fuera_de_alcance
    clase: dependiente
    consulta: ¿Qué concluí al comparar ColBERT con la fusión RRF de este sistema?
    espera: Responde exactamente «No lo tengo en la memoria.»
    reglas: [R2, R3]
    clave_negativa: ColBERT

  - id: P-12
    categoria: fuera_de_alcance
    clase: dependiente
    consulta: ¿Qué me pareció el paper de HippoRAG 2?
    espera: Responde exactamente «No lo tengo en la memoria.»
    reglas: [R2, R3]
    clave_negativa: HippoRAG

  - id: P-13
    categoria: fuera_de_alcance
    clase: invariante
    consulta: Dame el DOI del paper sobre destilación de difusión que leí ayer.
    espera: >-
      Responde exactamente «No lo tengo en la memoria.» Es invariante porque la
      formulación es plausible y genérica: sea cual sea el corpus, si no hay
      artefacto sobre eso la respuesta correcta es la misma frase.
    reglas: [R2, R3]
    clave_negativa: destilación de difusión

  - id: P-14
    categoria: fuera_de_alcance
    clase: invariante
    consulta: ¿Por qué elegí Qdrant como almacén vectorial?
