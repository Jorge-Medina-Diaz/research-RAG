  - id: P-19
    categoria: fuera_de_alcance
    clase: invariante
    consulta: ¿Qué latencia p95 mide el cerebro en producción?
    espera: >-
      Hay un SUELO de 8 s declarado en la spec, pero eso es un objetivo, no una
