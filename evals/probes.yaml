    reglas: [R1, R3, R6]
    requiere: [2026-08-12-la-configuracion-es-el-tratamiento-no-el-instrumento]

  - id: P-41
    categoria: temporal
    clase: invariante
    consulta: ¿Cuál es el hallazgo más reciente del corpus, y de qué fecha es?
    espera: >-
      Da la fecha del artefacto, no la de hoy, y no inventa un orden si varios
      comparten fecha: en ese caso lo dice.
    reglas: [R1, R3, R4, R6]
