      ¿Por qué no puedo comparar dos corridas si ingiero artefactos, y cómo
      convive eso con que la configuración sí pueda cambiar?
    espera: >-
      La época congela el objeto medido; las palancas son el tratamiento. Cruza
      épocas con la decisión sobre tratamiento e instrumento, y los presenta como
      dos artefactos, no como uno.
    reglas: [R1, R3, R5]
    requiere:
      - 2026-08-12-epocas-para-medir-un-corpus-que-crece
      - 2026-08-12-la-configuracion-es-el-tratamiento-no-el-instrumento

  # ---- aggregation: barre el corpus y resume ----

