    reglas: [R2, R3]
    clave_negativa: benchmark reranker local Cohere

  - id: P-17
    categoria: fuera_de_alcance
    clase: invariante
    consulta: ¿Cuántos artefactos tenía el corpus en enero de 2025?
    espera: >-
